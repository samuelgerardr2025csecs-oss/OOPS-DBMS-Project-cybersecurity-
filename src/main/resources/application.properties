spring.application.name=ExamEase
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/examease?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me-123456789}
app.teacher.name=${TEACHER_NAME:ExamEase Teacher}
app.teacher.username=${TEACHER_USERNAME:teacher@examease.local}
app.teacher.password=${TEACHER_PASSWORD:ChangeMe123!}
